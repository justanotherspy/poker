# fly.toml app configuration file generated for claude-poker on 2026-05-19T19:33:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = "claude-poker"
primary_region = "iad"

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
