name: Dependabot Bun Lockfile

on:
  pull_request:
    branches: [main]
    paths:
      - "frontend/package.json"

jobs:
  update-lockfile:
    name: Regenerate bun.lock
    runs-on: ubuntu-latest
    # Only run for dependabot PRs. When this job pushes the updated lockfile
    # via WORKFLOW_PAT, GitHub fires a new pull_request synchronize event with
    # actor=github-actions[bot], which skips this condition — preventing an
    # infinite loop while still letting the normal CI jobs run on the fresh commit.
    if: github.actor == 'dependabot[bot]'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          # PAT required: GITHUB_TOKEN pushes don't trigger other workflow runs,
          # so CI would never re-run on the updated lockfile commit.
          token: ${{ secrets.WORKFLOW_PAT }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Regenerate lockfile
        run: bun install
        working-directory: frontend

      - name: Commit and push if changed
        run: |
          git diff --exit-code frontend/bun.lock && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/bun.lock
          git commit -m "chore: regenerate bun lockfile"
          git push
